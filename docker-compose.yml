services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudfleet
      POSTGRES_USER: cloudfleet
      POSTGRES_PASSWORD: cloudfleet
    ports:
      - "5432:5432"
    volumes:
      - cloudfleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudfleet -d cloudfleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  activemq:
    image: apache/activemq-classic:5.18.3
    environment:
      ACTIVEMQ_CONNECTION_USER: admin
      ACTIVEMQ_CONNECTION_PASSWORD: admin
      ACTIVEMQ_WEB_USER: admin
      ACTIVEMQ_WEB_PASSWORD: admin
    ports:
      - "61616:61616"
      - "8161:8161"

  drone-service:
    build: ./drone-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudfleet?currentSchema=drone
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      activemq: { condition: service_started }

  mission-service:
    build: ./mission-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudfleet?currentSchema=mission
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      DRONE_SERVICE_URL: http://drone-service:8081
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      activemq: { condition: service_started }
      drone-service: { condition: service_started }

  maintenance-service:
    build: ./maintenance-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudfleet?currentSchema=maintenance
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      activemq: { condition: service_started }

  telemetry-service:
    build: ./telemetry-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudfleet?currentSchema=telemetry
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      activemq: { condition: service_started }

  alert-service:
    build: ./alert-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cloudfleet?currentSchema=alert
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      activemq: { condition: service_started }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      - drone-service
      - mission-service
      - maintenance-service
      - telemetry-service
      - alert-service

  grafana:
    image: grafana/grafana:11.2.2
    ports: [ "3000:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ChangeThisToAStrongPassword
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  cloudfleet-postgres:
  grafana-data:
