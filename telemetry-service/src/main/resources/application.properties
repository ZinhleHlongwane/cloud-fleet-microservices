server.port=${SERVER_PORT:8084}
spring.application.name=telemetry-service

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudfleet?currentSchema=telemetry}
spring.datasource.username=${DATABASE_USERNAME:cloudfleet}
spring.datasource.password=${DATABASE_PASSWORD:cloudfleet}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=3000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=false

spring.flyway.enabled=true
spring.flyway.schemas=telemetry
spring.flyway.create-schemas=true

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.jms.pub-sub-domain=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.jms.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:INFO}

